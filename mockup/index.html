<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Δροσερή Αθήνα</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--panel:#ffffff;--ink:#1d2421;--muted:#5d6763;--line:#e4e2db;--accent:#0f6b4f;--sel:#123c69;--chip:#eef4f1;--warn-bg:#fff7ed;--warn-line:#fed7aa;--warn-ink:#7c2d12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:1fr 420px;height:100vh}
#map{height:100%;background:var(--bg)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 40px}
h1{font-size:23px;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.45}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font:600 15px Inter,sans-serif;color:var(--muted);cursor:pointer}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.budget{margin-bottom:18px}
.budget .row{display:flex;justify-content:space-between;align-items:baseline}
.budget label{font-weight:600;font-size:15px}
.budget .val{font-size:26px;font-weight:700;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 0}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big div b{display:block;font-size:24px;font-weight:700}
.big div span{color:var(--muted);font-size:14px}
.impact{list-style:none;padding:0;margin:12px 0 0}
.impact li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.impact li .v{font-weight:700}
.impact li em{font-style:normal;color:var(--muted);font-size:14px;display:block;margin-top:2px}
.chip{display:inline-block;background:var(--chip);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:13px;font-weight:600;margin-right:6px}
.chip.other{background:#f1f0ec;color:var(--muted)}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.list li:hover{color:var(--accent)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
.back{border:0;background:none;color:var(--accent);font:600 15px Inter,sans-serif;padding:0;margin-bottom:12px;cursor:pointer}
.why{list-style:none;margin:0;padding:0}
.why li{padding:9px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.why li em{font-style:normal;color:var(--muted);font-size:14px;display:block}
.gaps{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--muted)}
details{margin-top:10px;font-size:14px}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted);line-height:1.5}
.legend{background:var(--panel);padding:10px 12px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:14px;line-height:1.6;max-width:260px}
.legend .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0}
.legend .bar i{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
@media (max-width:860px){
  .app{display:block;height:auto}
  #map{height:58vh}
  aside{border-left:0;border-top:1px solid var(--line);padding:16px}
  .legend{font-size:13px;max-width:190px;padding:8px 10px}
  .legend .extra{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <aside id="panel"></aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const D = window.DATA;
const L_ = c => (D.labels[c] && D.labels[c].label) || c;
const LONG = c => (D.labels[c] && D.labels[c].long) || "";
const fmt = (n, d = 0) => n == null ? "" : Number(n).toLocaleString("el-GR", {maximumFractionDigits: d, minimumFractionDigits: d});
const eur = n => n == null ? "" : n >= 1e6 ? fmt(n / 1e6, 2) + " εκατ. €" : fmt(Math.max(1, Math.round(n / 1000))) + " χιλ. €";
const round = (n, s) => Math.round(n / s) * s;
const UNIT = {degC: " °C", percent: "%", percent_of_area: "%", m2: " m²", persons_per_km2: " κάτοικοι/km²", trees_per_1000_residents: " ανά 1.000 κατοίκους"};
const STEPS = [100e3, 250e3, 500e3, 750e3, 1e6, 1.5e6, 2e6, 3e6, 5e6];
const RAMP = ["#fff3c4", "#fdd38a", "#f8a65a", "#e8743b", "#c2410c"];
const TABS = {
  streets: {id: "trees_pavement", label: "Δρόμοι", unitBig: "δέντρα σε πεζοδρόμια", legend: "Ανάγκη για σκιά στον δρόμο"},
  buildings: {id: "roof_cool_or_green_municipal", label: "Κτίρια", unitBig: "m² δροσερές στέγες", legend: "Ανάγκη για δροσερά κτίρια"}
};
const state = {tab: "streets", step: {streets: 4, buildings: 4}, open: null};
const nbs = D.nb.features.map(f => f.properties);
const nameOf = p => p.name.replace(/\d+$/, "");

function pkg(p, tab = state.tab) { return p.pk[TABS[tab].id]; }
function count(tab) { return nbs.filter(p => pkg(p, tab)).length; }

// Decision 2026-11-21-1528: each tab has its own budget; packages are taken in the engine's
// rank_within_intervention order (need), each whole, skipping any that no longer fits.
function selection() {
  const budget = STEPS[state.step[state.tab]];
  const cands = nbs.filter(p => pkg(p) && pkg(p).cost_eur && pkg(p).cost_eur.central != null)
    .sort((a, b) => pkg(a).rank_within_intervention - pkg(b).rank_within_intervention);
  let left = budget; const chosen = [];
  for (const p of cands) { const c = pkg(p).cost_eur.central; if (c <= left) { chosen.push(p); left -= c; } }
  return {budget, used: budget - left, chosen};
}

function colour(p) {
  const k = pkg(p);
  if (!k) return "#ecebe6";
  const i = Math.min(4, Math.floor((k.rank_within_intervention - 1) / count(state.tab) * 5));
  return RAMP[4 - i];
}

const map = L.map("map", {preferCanvas: true}).setView([37.985, 23.735], 13);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {attribution: "Esri, HERE, Garmin, © OpenStreetMap", maxZoom: 16}).addTo(map);

let chosenSet = new Set();
const styleOf = f => ({fillColor: colour(f.properties), fillOpacity: .72, color: chosenSet.has(f.properties.name) ? "#123c69" : "#ffffff", weight: chosenSet.has(f.properties.name) ? 3 : 1});
const nbLayer = L.geoJSON(D.nb, {
  style: styleOf,
  onEachFeature: (f, l) => {
    l.bindTooltip(nameOf(f.properties), {sticky: true});
    l.on("click", () => { state.open = f.properties.name; render(); });
  }
}).addTo(map);
map.fitBounds(nbLayer.getBounds(), {padding: [10, 10]});

const plantLayer = L.layerGroup(D.plant.map(([a, o]) => L.circleMarker([a, o], {radius: 1.4, stroke: false, fillColor: "#15803d", fillOpacity: .35})));
const siteColour = {school: "#7c3aed", nursery: "#db2777", playground: "#0891b2", friendship_club: "#b45309"};
const siteName = {school: "Σχολείο", nursery: "Βρεφονηπιακός", playground: "Παιδική χαρά", friendship_club: "Λέσχη Φιλίας"};
const marker = s => L.circleMarker([s[2], s[3]], {radius: 4.5, color: "#fff", weight: 1, fillColor: siteColour[s[0]], fillOpacity: .95});
const bareSites = L.layerGroup(D.sites.filter(s => s[4] != null && s[4] < 5).map(s => marker(s).bindTooltip(`${siteName[s[0]]}: ${s[1]}<br>Δέντρα σε 150 μ.: ${fmt(s[4], 1)}%<br>Νέα δέντρα από το 2024: ${fmt(s[5])}`)));
const roofSites = L.layerGroup(D.sites.filter(s => s[0] !== "playground").map(s => marker(s).bindTooltip(`${siteName[s[0]]}: ${s[1]}`)));

const legend = L.control({position: "bottomleft"});
legend.onAdd = () => { const d = L.DomUtil.create("div", "legend"); d.id = "legend"; return d; };
legend.addTo(map);

function drawMap() {
  [plantLayer, bareSites, roofSites].forEach(l => map.removeLayer(l));
  if (state.tab === "streets") { plantLayer.addTo(map); bareSites.addTo(map); } else roofSites.addTo(map);
  nbLayer.setStyle(styleOf);
  const bar = RAMP.map(c => `<i style="background:${c}"></i>`).join("");
  const sel = `<span class="dot" style="background:#123c69;border-radius:2px"></span>τα παίρνει το budget`;
  document.getElementById("legend").innerHTML = state.tab === "streets"
    ? `${TABS.streets.legend}<div class="bar">${bar}</div>μικρή → μεγάλη<br>${sel}<div class="extra"><span class="dot" style="background:#15803d"></span>φυτεύτηκαν 2024-2026<br>Χωρίς σκιά γύρω τους:<br><span class="dot" style="background:#7c3aed"></span>σχολείο <span class="dot" style="background:#db2777;margin-left:6px"></span>βρεφονηπιακός<br><span class="dot" style="background:#0891b2"></span>παιδική χαρά <span class="dot" style="background:#b45309;margin-left:6px"></span>Λέσχη</div>`
    : `${TABS.buildings.legend}<div class="bar">${bar}</div>μικρή → μεγάλη<br>${sel}<div class="extra"><span class="dot" style="background:#7c3aed"></span>σχολείο <span class="dot" style="background:#db2777;margin-left:6px"></span>βρεφονηπιακός<br><span class="dot" style="background:#b45309"></span>Λέσχη Φιλίας</div>`;
}

const n1 = v => fmt(v, Number.isInteger(v) ? 0 : 1);
function valueText(i) {
  const u = UNIT[i.unit] || "";
  const range = i.low != null && i.high != null && i.low !== i.high ? ` <em style="display:inline">(εύρος ${n1(i.low)} έως ${n1(i.high)})</em>` : "";
  return `έως ${n1(i.value_up_to)}${u}${range}`;
}
// labels_el phrases metrics as "Έως τόσους βαθμούς ..."; the value is shown first, so drop that lead-in.
const metricText = c => L_(c).replace(/^Έως τόσ(ους βαθμούς|ο|οι|η) /, "");
function impactItem(i) {
  return `<li><span class="v">${valueText(i)}</span> ${metricText(i.metric_code)}
    <em><span class="chip ${i.status === "measured_athens" ? "" : "other"}">${L_(i.status)}</span>${L_(i.source_code)}</em></li>`;
}
function impactsHtml(k) {
  const athens = k.impacts.filter(i => i.status === "measured_athens");
  const other = k.impacts.filter(i => i.status !== "measured_athens");
  const main = athens.length ? athens : other;
  const rest = athens.length ? other : [];
  return `<ul class="impact">${main.map(impactItem).join("")}</ul>` +
    (rest.length ? `<details><summary>Μελέτες από άλλες πόλεις (${rest.length})</summary><ul class="impact">${rest.map(impactItem).join("")}</ul></details>` : "");
}
function timeText(k) {
  const t = k.time_to_effect_years;
  if (!t) return "";
  return t.high <= 1 ? "από το πρώτο καλοκαίρι" : `σε ${t.low} έως ${t.high} χρόνια`;
}

function summary(sel) {
  const ps = sel.chosen;
  if (!ps.length) return `<div class="note">Με αυτό το ποσό δεν χωράει κανένα πακέτο. Ανέβασε το budget.</div>`;
  const q = ps.reduce((s, p) => s + pkg(p).quantity.central, 0);
  const sample = pkg(ps[0]);
  const third = state.tab === "streets"
    ? `<div><b>${fmt(round(ps.reduce((s, p) => s + (p.pop || 0), 0), 1000) / 1000)} χιλ.</b><span>κάτοικοι εκεί</span></div>`
    : `<div><b>${fmt(ps.reduce((s, p) => s + (pkg(p).sites_n || 0), 0))}</b><span>σχολεία και δημοτικά κτίρια</span></div>`;
  return `<div class="card"><h2>Με ${eur(sel.budget)} παίρνεις</h2>
    <div class="big">
      <div><b>${fmt(state.tab === "streets" ? q : round(q, 100))}</b><span>${TABS[state.tab].unitBig}</span></div>
      <div><b>${ps.length}</b><span>γειτονιές</span></div>
      ${third}
      <div><b>${eur(sel.used)}</b><span>από το budget</span></div>
    </div>
    ${impactsHtml(sample)}
    <p class="sub" style="margin:12px 0 0">Αποτέλεσμα ${timeText(sample)}.</p></div>
    ${state.tab === "buildings" ? `<div class="note">Εξοικονόμηση ρεύματος δεν δείχνουμε: τα περισσότερα σχολεία δεν έχουν κλιματισμό και κλείνουν το καλοκαίρι. Η τιμή ανά m² είναι προσωρινή μέχρι να δώσει τιμή ο Δήμος.</div>` : ""}`;
}

function listHtml(sel) {
  if (!sel.chosen.length) return "";
  const rows = sel.chosen.slice(0, 12).map(p => `<li data-n="${p.name}"><span>${nameOf(p)}</span><span>${eur(pkg(p).cost_eur.central)}</span></li>`).join("");
  const more = sel.chosen.length > 12 ? `<li style="cursor:default;color:var(--muted)">και ${sel.chosen.length - 12} ακόμα</li>` : "";
  return `<div class="card"><h2>Πού πάνε τα λεφτά, με σειρά ανάγκης</h2><ul class="list">${rows}${more}</ul></div>`;
}

function whyHtml(k) {
  return `<ul class="why">${(k.why_here || []).filter(w => w.value != null).map(w => {
    const u = UNIT[w.unit] || "";
    const d = w.unit === "percent_of_area" || w.unit === "degC" ? 1 : 0;
    const pct = w.percentile != null ? `<em>Μεγαλύτερη ανάγκη από το ${w.percentile}% των γειτονιών</em>` : "";
    return `<li>${L_(w.indicator_code)}: <b>${fmt(w.value, d)}${u}</b>${pct}</li>`;
  }).join("")}</ul>`;
}

function detail(p) {
  const out = [];
  for (const [tab, t] of Object.entries(TABS)) {
    const k = pkg(p, tab);
    if (!k) continue;
    const q = k.quantity, c = k.cost_eur;
    const qTxt = tab === "streets" ? `${fmt(q.central)}` : `${fmt(round(q.central, 10))} m²`;
    const sources = [...new Set(k.impacts.map(i => L_(i.source_code)))];
    out.push(`<div class="card"><h2>${L_(t.id)}</h2>
      <div class="big">
        <div><b>${qTxt}</b><span>${tab === "streets" ? `δέντρα (${fmt(q.low)} έως ${fmt(q.high)})` : "κάτοψη στεγών δημοτικών κτιρίων"}</span></div>
        <div><b>${eur(c.central)}</b><span>κόστος (${eur(c.low)} έως ${eur(c.high)})</span></div>
      </div>
      ${impactsHtml(k)}
      <p class="sub" style="margin:12px 0 0">Αποτέλεσμα ${timeText(k)}. Θέση στη σειρά ανάγκης: ${k.rank_within_intervention} από ${count(tab)}.</p>
      <details><summary>Γιατί εδώ</summary>${whyHtml(k)}</details>
      <details><summary>Τι δεν ξέρουμε ακόμα</summary><ul>${(k.data_gaps || []).map(g => `<li>${L_(g)}</li>`).join("")}</ul></details>
      <details><summary>Από πού βγαίνει</summary><ul>${sources.map(s => `<li>${s}</li>`).join("")}<li>Υπολογισμός: ${D.generated_from ? D.generated_from.generator : "engine"}</li></ul></details>
    </div>`);
  }
  if (!out.length) out.push(`<div class="note">Εδώ ο υπολογισμός δεν προτείνει παρέμβαση: δεν βρέθηκε κενό ή λείπει τιμή.</div>`);
  return `<button class="back" id="back">← Πίσω στο budget</button>
    <h1>${nameOf(p)}</h1><p class="sub">${p.dk}η Δημοτική Κοινότητα${p.pop ? ` · περίπου ${fmt(round(p.pop, 100))} κάτοικοι` : ""}</p>${out.join("")}`;
}

function updateBody(panel) {
  const s = selection();
  chosenSet = new Set(s.chosen.map(p => p.name));
  drawMap();
  panel.querySelector(".val").textContent = eur(STEPS[state.step[state.tab]]);
  panel.querySelector("#body").innerHTML = summary(s) + listHtml(s);
  panel.querySelectorAll(".list li[data-n]").forEach(li => li.onclick = () => openNb(li.dataset.n, true));
}
function openNb(name, zoom) {
  state.open = name;
  if (zoom) { const l = nbLayer.getLayers().find(x => x.feature.properties.name === name); if (l) map.fitBounds(l.getBounds(), {maxZoom: 15}); }
  render();
}

function render() {
  const panel = document.getElementById("panel");
  if (state.open) {
    const s = selection(); chosenSet = new Set(s.chosen.map(p => p.name)); drawMap();
    panel.innerHTML = detail(nbs.find(p => p.name === state.open));
    document.getElementById("back").onclick = () => { state.open = null; render(); };
    panel.scrollTop = 0;
    return;
  }
  panel.innerHTML = `<h1>Δροσερή Αθήνα</h1>
    <p class="sub">Πού να πάνε πρώτα τα λεφτά για μια πιο δροσερή πόλη. Υπολογισμός από τα ανοιχτά δεδομένα του Δήμου.</p>
    <div class="tabs">${Object.entries(TABS).map(([k, t]) => `<button class="tab ${state.tab === k ? "on" : ""}" data-t="${k}">${t.label}</button>`).join("")}</div>
    <div class="budget"><div class="row"><label for="b">Budget</label><span class="val"></span></div>
      <input id="b" type="range" min="0" max="${STEPS.length - 1}" step="1" value="${state.step[state.tab]}"></div>
    <div id="body"></div>`;
  panel.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.tab = b.dataset.t; render(); });
  panel.querySelector("#b").oninput = e => { state.step[state.tab] = +e.target.value; updateBody(panel); };
  updateBody(panel);
}
render();
</script>
</body>
</html>
